version: "3.8"
services:
  # The "Pipe" (WireGuard VPN)
  vpn-gateway:
    image: linuxserver/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SERVERURL=your.gcp.ip.here
      - PEERS=phone1,phone2
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

  # The "Brain" (networkXG Logic)
  networkxg-logic:
    build: .
    network_mode: "service:vpn-gateway" # Attaches logic directly to the VPN pipe
    depends_on:
      - vpn-gateway
